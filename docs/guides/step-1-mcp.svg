      <stop offset="0" stop-color="#efe9df"/>
      <stop offset="1" stop-color="#d9d2c6"/>
    </linearGradient>
    <filter id="sh1" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3a2f1e" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="880" height="500" fill="url(#bg1)"/>
  <g filter="url(#sh1)">
    <rect x="58" y="40" width="764" height="420" rx="18" fill="#ffffff"/>
