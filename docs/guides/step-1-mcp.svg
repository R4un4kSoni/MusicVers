  <path d="M700 398 q34 -26 66 0" fill="none" stroke="#8b6f57" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="96" y="430" font-family="Arial, sans-serif" font-size="13" fill="#6b645b">Tip: you do not need a MusicAtlas API key for this setup — the proxy uses the public MCP endpoint.</text>
